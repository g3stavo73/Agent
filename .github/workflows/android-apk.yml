
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scr/Agent.Mobile/**'
      - 'scr/agent.core/**'
      - 'Directory.build.props'
      - 'global.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore scr/Agent.Mobile/Agent.Mobile.csproj

      - name: Build APK
        run: |
          dotnet publish scr/Agent.Mobile/Agent.Mobile.csproj \
            --configuration Release \
            --framework net11.0-android37.0 \
            --no-restore \
            -p:AndroidPackageFormats=apk \
            -p:AndroidKeyStore=false

      - name: Locate APK
        run: |
          mkdir -p artifacts
          find scr/Agent.Mobile/bin/Release \
            -type f -name '*.apk' \
            -exec cp {} artifacts/Agent.apk \;
          test -f artifacts/Agent.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Android-APK
          path: artifacts/Agent.apk
          if-no-files-found: error
