
name: Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'scr/Agent.Mobile/**'
      - 'scr/agent.core/**'
      - 'Directory.build.props'
      - 'global.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify SDK
        run: dotnet --info

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Verify Android workload
        run: dotnet workload list

      - name: Restore dependencies
        run: |
          dotnet restore scr/Agent.Mobile/Agent.Mobile.csproj

      - name: Build and publish APK
        run: |
          dotnet publish \
            scr/Agent.Mobile/Agent.Mobile.csproj \
            --configuration Release \
            --framework net11.0-android37.2 \
            --no-restore \
            -p:AndroidPackageFormats=apk \
            -p:AndroidKeyStore=false

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          APK_PATH="$(find scr/Agent.Mobile/bin/Release \
            -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "APK was not generated."
            exit 1
          fi

          cp "$APK_PATH" artifacts/Agent.apk

          sha256sum artifacts/Agent.apk \
            > artifacts/Agent.apk.sha256

          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Android-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
