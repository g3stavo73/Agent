services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      AGENT_DB_USER: ${AGENT_DB_USER:?Set AGENT_DB_USER in deploy/.env}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?Set AGENT_DB_PASSWORD in deploy/.env}
    volumes:
      - agent-postgres:/var/lib/postgresql/data
      - ../database/postgres/migrations/001_initial_postgres.sql:/docker-entrypoint-initdb.d/001_initial_postgres.sql:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/002-init-agent.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: agent-api:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AgentDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${AGENT_DB_USER};Password=${AGENT_DB_PASSWORD};Pooling=true;Maximum Pool Size=50
      MicrosoftIdentity__ApiAudience: ${AGENT_API_AUDIENCE:?Set AGENT_API_AUDIENCE in deploy/.env}
      AiStoWorker__ExecutablePath: /app/aisto-worker
      AiStoWorker__TimeoutSeconds: ${AISTO_WORKER_TIMEOUT_SECONDS:-15}
      AiStoWorker__WorkerCount: ${AISTO_WORKER_COUNT:-2}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  agent-postgres:
